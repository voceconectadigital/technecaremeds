<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` e `maximum-scale` ausente.

      O portal é usado em pé, no corredor, com uma mão. Bloquear o zoom seria
      impedir quem enxerga pouco de ler o próprio chamado — e a WCAG 1.4.4
      exige que o texto amplie até 200%.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070a10" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/marca/itech-simbolo.png" />
    <link rel="apple-touch-icon" href="/marca/itech-icone-180.png" />
    <title>Portal — Téchne Care</title>
    <script>
      (function () {
        var modos = { futuristico: 'dark', mindfulness: 'light', wellness: 'light' };
        var estilo = 'futuristico';
        try {
          var guardado = localStorage.getItem('aurora:estilo');
          if (guardado && modos[guardado]) estilo = guardado;
        } catch (e) {
          /* modo privado sem localStorage: vale o padrão futurístico */
        }
        document.documentElement.dataset.estilo = estilo;
        document.documentElement.dataset.theme = modos[estilo];
        document.documentElement.style.colorScheme = modos[estilo];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
