<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- `theme-color` acompanha o tema: sem isto, a barra do navegador no
         celular fica clara com a página escura. -->
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070a10" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/marca/itech-simbolo.png" />
    <link rel="apple-touch-icon" href="/marca/itech-icone-180.png" />
    <title>Téchne Care</title>
    <script>
      /*
       * O tema é aplicado ANTES de o React montar.
       *
       * Sem isto a página pisca branca antes de escurecer — e quem trabalha à
       * noite no hospital recebe um flash na cara a cada carregamento.
       */
      (function () {
        var modos = { techne: 'light', futuristico: 'dark', mindfulness: 'light', wellness: 'light' };
        var estilo = 'techne';
        try {
          var guardado = localStorage.getItem('aurora:estilo');
          if (guardado && modos[guardado]) estilo = guardado;
        } catch (e) {
          /* modo privado sem localStorage: vale o padrão Téchne */
        }
        document.documentElement.dataset.estilo = estilo;
        document.documentElement.dataset.theme = modos[estilo];
        document.documentElement.style.colorScheme = modos[estilo];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
