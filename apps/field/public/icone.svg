<!--
  Aurora — o ícone do aplicativo instalado.

  SVG e não PNG: um ícone vetorial serve a todas as densidades de tela sem
  gerar oito arquivos, e o aplicativo instalado aparece em telas que vão do
  relógio ao tablet. `maskable` fica de fora de propósito — sem a área segura
  desenhada, o Android recortaria o traço.
-->
