<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` e SEM `maximum-scale`.

      O aplicativo é usado em pé, muitas vezes de luva, às vezes numa casa de
      máquinas mal iluminada. Bloquear o zoom impediria quem enxerga pouco de
      ler o próprio checklist — e a WCAG 1.4.4 exige ampliação até 200%.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/marca/technecare-simbolo.png" />
    <title>Campo — Téchne Care</title>
    <script>
      (function () {
        try {
          var escolhido = localStorage.getItem('aurora:tema');
          if (escolhido === 'dark' || escolhido === 'light') {
            document.documentElement.setAttribute('data-theme', escolhido);
          }
        } catch (e) {
          /* Modo privado bloqueia o armazenamento. A página funciona sem. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
