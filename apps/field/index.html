<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` e SEM `maximum-scale`.

      O aplicativo é usado em pé, muitas vezes de luva, às vezes numa casa de
      máquinas mal iluminada. Bloquear o zoom impediria quem enxerga pouco de
      ler o próprio checklist — e a WCAG 1.4.4 exige ampliação até 200%.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070a10" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/marca/itech-simbolo.png" />
    <link rel="apple-touch-icon" href="/marca/itech-icone-180.png" />
    <title>Campo — Téchne Care</title>
    <script>
      (function () {
        var modos = { techne: 'light', futuristico: 'dark', mindfulness: 'light', wellness: 'light' };
        var estilo = 'techne';
        try {
          var guardado = localStorage.getItem('aurora:estilo');
          if (guardado && modos[guardado]) estilo = guardado;
        } catch (e) {
          /* modo privado sem localStorage: vale o padrão Téchne */
        }
        document.documentElement.dataset.estilo = estilo;
        document.documentElement.dataset.theme = modos[estilo];
        document.documentElement.style.colorScheme = modos[estilo];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
